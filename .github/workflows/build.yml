name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the fixed "ci-build" release can be created/updated by the publish step.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java
        run: ./gradlew compileJava

      - name: Run Tests
        run: ./gradlew test

      - name: Build Fat Jar
        run: ./gradlew build -x test

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-jar
          path: |
            build/libs/CardBoard-Fork-SharkMI-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-slim.jar
          retention-days: 14

      # Publishes the jar to a fixed, login-free download link:
      #   https://github.com/SharkMI-0x7E/CardBoard/releases/download/ci-build/<file>.jar
      # Updated on every push to main (--clobber replaces the old asset).
      # Tag "ci-build" deliberately does not match the "v*" release workflow.
      - name: Publish fixed-download-link CI build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-build >/dev/null 2>&1 || \
            gh release create ci-build \
              --prerelease \
              --title "CI Build (latest main)" \
              --notes "Automatic build of the latest main branch. Updated on every push to main. Grab the jar below (also keeps the version in its file name)."
          for f in build/libs/CardBoard-Fork-SharkMI-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-slim.jar) continue;;
            esac
            gh release upload ci-build "$f" --clobber
          done

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 30
