name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Needed so the fixed "ci-build" release can be created/updated by the publish step.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Java
        run: ./gradlew compileJava

      - name: Run Tests
        run: ./gradlew test

      - name: Build Fat Jar
        run: ./gradlew build -x test -Pcardboard.build=${{ github.run_number }}
        # The workflow run number doubles as the CI build number (bN), the same
        # idea as Citizens' Jenkins build numbers. Produces e.g.
        # CardBoard-Fork-SharkMI-1.21.11-2026.10.1+b146.jar
        # See docs/ai/CONTEXT/BUILD-NUMBER.md.

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cardboard-b${{ github.run_number }}
          path: |
            build/libs/CardBoard-Fork-SharkMI-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
            !build/libs/*-slim.jar
          retention-days: 14

      # Publishes the latest jar (named with the CI build number, e.g. ...+b146.jar)
      # to the "ci-build" release, so the site can offer a one-tap download and
      # the release page always shows exactly one, clearly labelled build.
      # Tag "ci-build" deliberately does not match the "v*" release workflow.
      - name: Publish latest CI build (ci-build release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-build >/dev/null 2>&1 || \
            gh release create ci-build \
              --prerelease \
              --title "CI Build (latest main)" \
              --notes "Automatic build of the latest main branch. The jar name carries the CI build number (bN), the same idea as Citizens' Jenkins builds. Only the newest build is kept here; older ones live in the Actions tab."
          # keep exactly one jar: drop the previous build's assets first
          gh release view ci-build --json assets --jq '.assets[].name' | while read -r name; do
            if [ -n "$name" ]; then gh release delete-asset ci-build "$name" -y; fi
          done
          for f in build/libs/CardBoard-Fork-SharkMI-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-slim.jar) continue;;
            esac
            gh release upload ci-build "$f" --clobber
          done

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 30
